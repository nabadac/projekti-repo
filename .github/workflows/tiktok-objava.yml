# Svaki sat: videi čiji je termin došao šalju se u TikTok inbox kao skica.
name: TikTok objava po rasporedu

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-raspored
  cancel-in-progress: false

jobs:
  objava:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ima li dospjelih videa?
        id: provjera
        run: node tiktok/objavi.mjs --provjeri

      - name: Pošalji u TikTok inbox
        if: steps.provjera.outputs.ima == 'da'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: node tiktok/objavi.mjs

      - name: Spremi stanje rasporeda
        if: always() && steps.provjera.outputs.ima == 'da'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok/raspored.json
          git diff --cached --quiet && exit 0
          git commit -m "TikTok: stanje slanja"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
